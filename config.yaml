# MalForge local configuration.
# Every key below is read by main.py. CLI arguments and environment variables
# take precedence over these values.

paths:
  # Root directory for generated artifacts. Subdirectories (sigma/, wazuh/,
  # test_events/, reports/, iocs/, navigator/) are fixed by the pipeline.
  output_dir: output

wazuh:
  custom_rule_id_start: 100000
  custom_rule_id_end: 119999
  custom_rule_id_offset: 0

integrations:
  # Offline URLhaus CSV export used for local URL/domain IOC matching.
  urlhaus_csv: ""
  # Credentials below only enable local lookup descriptors. No network request
  # is ever sent by this project.
  virustotal_api_key: ""
  misp_url: ""
  misp_api_key: ""
